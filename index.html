<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory</title>
  </head>

  <body>
    <!-- ==========================================
         HOME SCREEN
    ========================================== -->

    <main class="home">
      <div class="home__content">
        <img
          class="home__title"
          src="/src/assets/Text.svg"
          alt="Ready to play?"
        />

        <button
          class="home__play-button"
          type="button"
          aria-label="Play"
        >
          <img
            src="/src/assets/Primary button.svg"
            alt=""
          />
        </button>
      </div>

      <img
        class="home__controller"
        src="/src/assets/stadia_controller.svg"
        alt=""
        aria-hidden="true"
      />
    </main>

    <!-- ==========================================
         SETTINGS SCREEN
    ========================================== -->

    <section class="settings" hidden>
      <div class="settings__container">
        <img
          class="settings__headline"
          src="/src/assets/Headline.svg"
          alt="Settings"
        />

        <div class="settings__layout">
          <div class="settings__options">

            <!-- GAME THEMES -->

            <fieldset class="settings__group">
              <legend class="settings__group-title">
                <img
                  src="/src/assets/palette.svg"
                  alt=""
                />
                <span>Game themes</span>
              </legend>

              <label class="settings__option">
                <input
                  type="radio"
                  name="theme"
                  value="code"
                  checked
                />
                <span>Code vibes theme</span>
              </label>

              <label class="settings__option">
                <input
                  type="radio"
                  name="theme"
                  value="gaming"
                />
                <span>Gaming theme</span>
              </label>
            </fieldset>

           

            <fieldset class="settings__group">
              <legend class="settings__group-title">
                <img
                  src="/src/assets/choose.svg"
                  alt=""
                />
                <span>Choose player</span>
              </legend>

              <label class="settings__option">
                <input
                  type="radio"
                  name="player"
                  value="blue"
                  checked
                />
                <span>Blue</span>
              </label>

              <label class="settings__option">
                <input
                  type="radio"
                  name="player"
                  value="orange"
                />
                <span>Orange</span>
              </label>
            </fieldset>

           

            <fieldset class="settings__group">
              <legend class="settings__group-title">
                <img
                  src="/src/assets/board.svg"
                  alt=""
                />
                <span>Board size</span>
              </legend>

              <label class="settings__option">
                <input
                  type="radio"
                  name="boardSize"
                  value="16"
                  checked
                />
                <span>16 cards</span>
              </label>

              <label class="settings__option">
                <input
                  type="radio"
                  name="boardSize"
                  value="24"
                />
                <span>24 cards</span>
              </label>

              <label class="settings__option">
                <input
                  type="radio"
                  name="boardSize"
                  value="36"
                />
                <span>36 cards</span>
              </label>
            </fieldset>
          </div>

          <div class="settings__right">

            

            <img
              class="settings__preview"
              src="/src/assets/codetheme.svg"
              alt="Vorschau: Code vibes theme"
            />
            <!-- SETTINGS FOOTER -->
<div class="settings__footer">
  <span id="selected-theme">Code vibes</span>

  <img
    class="settings__divider"
    src="/src/assets/Line 6.svg"
    alt=""
  />

  <span id="selected-player">Blue</span>

  <img
    class="settings__divider"
    src="/src/assets/Line 6.svg"
    alt=""
  />

  <span id="selected-board-size">16 cards</span>

  <img
    class="settings__divider"
    src="/src/assets/Line 6.svg"
    alt=""
  />

  <button
    class="settings__start"
    type="button"
    aria-label="Start game"
  >
    <img
      src="/src/assets/start.svg"
      alt=""
    />
  </button>
</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ==========================================
         MEMORY GAME
    ========================================== -->

    <section class="game" hidden>
      <header class="game__header">

       <!-- PUNKTEANZEIGE -->

<div class="game__scores">
  <div class="game__score game__score--blue">
    <img
      class="game__score-icon--blue"
      src="/src/assets/label 1.svg"
      alt=""
    />

    <span>
      <span class="game__score-name">Blue</span>
      <strong id="score-blue">0</strong>
    </span>
  </div>

  <div class="game__score game__score--orange">
    <img
      class="game__score-icon--orange"
      src="/src/assets/label.svg"
      alt=""
    />

    <span>
      <span class="game__score-name">Orange</span>
      <strong id="score-orange">0</strong>
    </span>
  </div>
</div>
        
<div class="game__current-player">
  <span>Current player:</span>

  <span class="game__current-icon-bg">
    <img
      class="game__current-icon"
      src="/src/assets/label 1.svg"
      alt="Blue"
    />
  </span>
</div>

      
        <button
          class="game__exit"
          type="button"
          aria-label="Exit game"
        >
          <img
            src="/src/assets/secondary button.svg"
            alt=""
          />
        </button>
      </header>

      <!-- MEMORY SPIELFELD -->

      <div class="game__board"></div>
    </section>

    <!-- ==========================================
         EXIT GAME POPUP
    ========================================== -->

    <div
      class="exit-modal"
      id="exit-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="exit-modal-title"
      hidden
    >
      <div class="exit-modal__content">
        <h2
          class="exit-modal__title"
          id="exit-modal-title"
        >
          Are you sure you want to quit the game?
        </h2>

        <div class="exit-modal__buttons">

          <!-- BACK TO GAME -->

          <button
            class="exit-modal__back"
            type="button"
            aria-label="Back to game"
          >
            <img
              src="/src/assets/back1.svg"
              alt=""
            />
          </button>

          <!-- EXIT GAME BESTÄTIGEN -->

          <button
            class="exit-modal__confirm"
            type="button"
            aria-label="Exit game"
          >
            <img
              src="/src/assets/exit.svg"
              alt=""
            />
          </button>
        </div>
      </div>
    </div>

    <!-- ==========================================
         GAME OVER SCREEN
    ========================================== -->

    <section class="game-over" hidden>
      <div class="game-over__content">

        <!-- GAME OVER ÜBERSCHRIFT -->

        <img
          class="game-over__title"
          src="/src/assets/game over.svg"
          alt="Game over"
        />

        <!-- FINALE PUNKTEANZEIGE -->

        <div class="game-over__results">
          <p class="game-over__subtitle">
            Final score
          </p>

          <div class="game-over__scores">
            <div class="game-over__score game-over__score--blue">
              <img
                src="/src/assets/label 1.svg"
                alt=""
              />

              <span>
                Blue <strong id="final-score-blue">0</strong>
              </span>
            </div>

            <div class="game-over__score game-over__score--orange">
              <img
                src="/src/assets/label.svg"
                alt=""
              />

              <span>
                Orange <strong id="final-score-orange">0</strong>
              </span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ==========================================
         WINNER SCREEN
    ========================================== -->

    <section class="winner" hidden>


      <img
        class="winner__confetti"
        src="/src/assets/Confetti.svg"
        alt=""
        aria-hidden="true"
      />

      <div class="winner__content">

        <!-- GEWINNER ÜBERSCHRIFT -->

        <p class="winner__subtitle">
          The winner is
        </p>

      
        <h1
          class="winner__name"
          id="winner-name"
        >
          ORANGE PLAYER
        </h1>

        <img
          class="winner__player"
          id="winner-player"
          src="/src/assets/orangeplayer.svg"
          alt="Orange player"
        />

        <!-- BACK TO START -->

        <button
          class="winner__back"
          type="button"
          aria-label="Back to start"
        >
          <img
            src="/src/assets/backtostart.svg"
            alt=""
          />
        </button>
      </div>
    </section>

        <!-- ==========================================
         DRAW SCREEN
    ========================================== -->

    <section class="draw" hidden>
      <div class="draw__content">

        <img
  class="draw__gaming-image"
  src="/src/assets/Content.svg"
  alt="It's a draw"
/>

        <img
          class="draw__title"
          src="/src/assets/draw.svg"
          alt="It's a draw"
        />

        <img
          class="draw__icon"
          src="/src/assets/drawicon.svg"
          alt=""
          aria-hidden="true"
        />

        <button
          class="draw__back"
          type="button"
          aria-label="Back to start"
        >
          <img
            src="/src/assets/backtostart.svg"
            alt=""
          />
        </button>

      </div>
    </section>
     <!-- ==========================================
         TYPESCRIPT
    ========================================== -->

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
